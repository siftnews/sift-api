name: CI

# develop/main 대상 PR에서 gradle build+test를 필수 체크로 실행한다.
# 테스트는 @ActiveProfiles("test") + Testcontainers(Docker) 기반 — ubuntu-latest에 Docker가 내장돼 별도 설정이 필요 없다.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# 같은 ref에 새 푸시가 오면 진행 중인 실행을 취소해 러너 낭비를 줄인다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: JDK 21 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle wrapper 검증
        uses: gradle/actions/wrapper-validation@v4

      - name: Gradle 설정 (의존성·빌드 캐시)
        uses: gradle/actions/setup-gradle@v4

      - name: 빌드 + 테스트
        run: ./gradlew build --no-daemon

      - name: 테스트 리포트 업로드 (실패 시)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore
