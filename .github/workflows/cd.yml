name: CD

# main 병합은 push 이벤트를 발생시키므로 별도 merge 트리거를 추가하지 않는다.
# 이 workflow는 production이 아닌 GCP staging/benchmark 환경만 대상으로 한다.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: staging-cd
  cancel-in-progress: false

permissions:
  # API와 private infra 저장소 checkout
  contents: read

env:
  GCP_PROJECT_ID: sift-news-20260810
  GCP_REGION: asia-northeast3
  GCP_ZONE: asia-northeast3-a
  GCP_VM_NAME: sift-staging-vm
  GCP_SQL_INSTANCE: sift-staging-db
  API_IMAGE: asia-northeast3-docker.pkg.dev/sift-news-20260810/sift-api/sift-api
  SIFT_INFRA_REPOSITORY: siftnews/sift-infra
  SIFT_INFRA_REF: main
  PROMETHEUS_IMAGE: prom/prometheus@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
  GRAFANA_IMAGE: grafana/grafana@sha256:ab5cb380e3ff3172d6c8bd2e7cfd31cce977d2881b260e1f5bc089bf0b759b43
  MAILPIT_IMAGE: axllent/mailpit@sha256:d5ecbb067db3705fa953d79e1b7f81ef84038df67aba6c52825d8c02a1ea748a

jobs:
  deploy-staging:
    name: staging deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    permissions:
      # API와 private infra 저장소 checkout
      contents: read
      # GitHub OIDC 토큰으로 GCP Workload Identity Federation 인증
      id-token: write
    env:
      IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      # deploy-compose.sh 내부의 gcloud SSH/SCP도 비대화형으로 실행
      CLOUDSDK_CORE_DISABLE_PROMPTS: '1'

    steps:
      - name: API checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: JDK 21 설치
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: GCP 인증
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Cloud SDK 설치
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          version: '>= 390.0.0'

      - name: Artifact Registry 인증
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: staging 리소스 준비 상태 확인
        shell: bash
        run: |
          set -euo pipefail

          vm_status="$(gcloud compute instances describe "${GCP_VM_NAME}" \
            --project="${GCP_PROJECT_ID}" \
            --zone="${GCP_ZONE}" \
            --format='value(status)')"
          sql_state="$(gcloud sql instances describe "${GCP_SQL_INSTANCE}" \
            --project="${GCP_PROJECT_ID}" \
            --format='value(state)')"

          if [[ "${vm_status}" != "RUNNING" || "${sql_state}" != "RUNNABLE" ]]; then
            echo "staging 리소스가 준비되지 않았다: VM=${vm_status}, Cloud SQL=${sql_state}" >&2
            echo "먼저 sift-infra/scripts/staging-lifecycle.sh start를 실행한다." >&2
            exit 1
          fi

      - name: 이미지 빌드·게시
        run: ./gradlew bootBuildImage --imagePlatform=linux/amd64 --imageName="${API_IMAGE}:${IMAGE_TAG}" --publishImage

      - name: 게시 이미지 digest 확인
        id: image
        shell: bash
        run: |
          set -euo pipefail

          digest="$(gcloud artifacts docker images describe "${API_IMAGE}:${IMAGE_TAG}" \
            --project="${GCP_PROJECT_ID}" \
            --format='value(image_summary.digest)')"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Artifact Registry digest 확인 실패" >&2
            exit 1
          fi

          image_ref="${API_IMAGE}@${digest}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "image_ref=${image_ref}" >> "${GITHUB_OUTPUT}"

      - name: private infra checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ env.SIFT_INFRA_REPOSITORY }}
          ref: ${{ env.SIFT_INFRA_REF }}
          token: ${{ secrets.SIFT_INFRA_READ_TOKEN }}
          path: sift-infra
          persist-credentials: false

      - name: staging 배포 계약 확인
        run: |
          test -x sift-infra/scripts/deploy-compose.sh
          test -f sift-infra/compose.yaml
          test -x sift-infra/scripts/smoke.sh

      - name: staging 환경 파일 생성
        id: envfile
        shell: bash
        run: |
          set -euo pipefail

          sql_host="$(gcloud sql instances describe "${GCP_SQL_INSTANCE}" \
            --project="${GCP_PROJECT_ID}" \
            --format='value(ipAddresses[0].ipAddress)')"
          db_password="$(gcloud secrets versions access latest \
            --secret=sift-staging-db-password \
            --project="${GCP_PROJECT_ID}")"
          grafana_password="$(gcloud secrets versions access latest \
            --secret=sift-staging-grafana-password \
            --project="${GCP_PROJECT_ID}")"

          if [[ -z "${sql_host}" || -z "${db_password}" || -z "${grafana_password}" ]]; then
            echo "staging 접속 정보 또는 Secret Manager 값이 비어 있다" >&2
            exit 1
          fi

          echo "::add-mask::${db_password}"
          echo "::add-mask::${grafana_password}"

          env_file="${RUNNER_TEMP}/sift-staging.env"
          umask 077
          {
            printf 'SIFT_API_IMAGE=%s\n' "${{ steps.image.outputs.image_ref }}"
            printf 'PROMETHEUS_IMAGE=%s\n' "${PROMETHEUS_IMAGE}"
            printf 'GRAFANA_IMAGE=%s\n' "${GRAFANA_IMAGE}"
            printf 'MAILPIT_IMAGE=%s\n' "${MAILPIT_IMAGE}"
            printf 'SPRING_PROFILES_ACTIVE=local,loadtest\n'
            printf 'SIFT_LOAD_TEST_SUBSCRIBERS_COUNT=100000\n'
            printf 'SIFT_LOAD_TEST_SUBSCRIBERS_EMAIL_DOMAIN=loadtest.sift.local\n'
            printf 'SIFT_LOAD_TEST_WORKLOAD_SCENARIO=realistic\n'
            printf 'CLOUD_SQL_HOST=%s\n' "${sql_host}"
            printf 'CLOUD_SQL_PORT=5432\n'
            printf 'DB_NAME=sift\n'
            printf 'DB_USERNAME=siftapp\n'
            printf 'DB_PASSWORD=%s\n' "${db_password}"
            printf 'MAIL_HOST=mailpit\n'
            printf 'MAIL_PORT=1025\n'
            printf 'API_PORT=8080\n'
            printf 'PROMETHEUS_PORT=9090\n'
            printf 'GRAFANA_PORT=3000\n'
            printf 'GRAFANA_ADMIN_USER=admin\n'
            printf 'GRAFANA_ADMIN_PASSWORD=%s\n' "${grafana_password}"
          } > "${env_file}"

          echo "path=${env_file}" >> "${GITHUB_OUTPUT}"

      - name: Compose staging 배포
        working-directory: sift-infra
        env:
          ENV_FILE: ${{ steps.envfile.outputs.path }}
        run: ./scripts/deploy-compose.sh

      - name: 원격 임시 파일 정리
        if: always()
        run: |
          gcloud compute ssh "${GCP_VM_NAME}" \
            --project="${GCP_PROJECT_ID}" \
            --zone="${GCP_ZONE}" \
            --tunnel-through-iap \
            --quiet \
            --command='sudo rm -rf /tmp/sift-infra'

      - name: staging smoke
        shell: bash
        run: |
          set -euo pipefail

          gcloud compute ssh "${GCP_VM_NAME}" \
            --project="${GCP_PROJECT_ID}" \
            --zone="${GCP_ZONE}" \
            --tunnel-through-iap \
            --quiet \
            --command='cd /opt/sift-infra && sudo ./smoke.sh'

      - name: 배포 결과 요약
        if: ${{ !cancelled() }}
        env:
          DEPLOYED_IMAGE: ${{ steps.image.outputs.image_ref }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail

          {
            echo "## staging 배포 결과: ${JOB_STATUS}"
            echo
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- API image: \`${DEPLOYED_IMAGE:-미게시}\`"
            echo "- profile: \`local,loadtest\`"
            if [[ "${JOB_STATUS}" == "success" ]]; then
              echo "- smoke: \`OK\`"
            else
              echo "- smoke: \`실패 또는 미실행\`"
              echo '- 재실행: Actions에서 해당 workflow를 재실행한다.'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
