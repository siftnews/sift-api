spring:
  application:
    name: sift-api

  # 로컬 기본값. 운영/CI는 SPRING_PROFILES_ACTIVE 환경변수로 override
  # 테스트는 @ActiveProfiles("test") + Testcontainers 사용 (local 프로파일 쓰지 말 것)
  profiles:
    active: local

  jpa:
    open-in-view: false       # 환경 무관 공통

  batch:
    job:
      enabled: false          # 부팅 시 Job 자동 실행 금지 (스케줄/트리거로 기동)

  task:
    scheduling:
      pool:
        # 기본값 1이면 수집·선별·발송·재시도 트리거가 한 스레드를 두고 줄을 선다 —
        # 하나의 배치 기동이 오래 걸려도 다른 주기가 밀리지 않도록 트리거 수만큼 확보한다.
        size: 4

sift:
  collection:
    # 수집 주기 (MVP-DESIGN §3①). 매시 정각은 수집기가 몰리는 시각이라 10분 비켜 둔다
    cron: "0 10 * * * *"
    zone: Asia/Seoul

  selection:
    # 매일 발행 기준 시각 (D-019). 운영값은 프로파일에서 override
    cron: "0 0 6 * * *"
    zone: Asia/Seoul
    # 후보 윈도우 크기 — 발행이 하루 한 번이고 topic.recency_half_life_hours 기본값도 24라 정렬을 맞춘다
    window-hours: 24

  delivery:
    cron: "0 0 * * * *"
    zone: Asia/Seoul
    retry:
      cron: "0 */5 * * * *"
      zone: Asia/Seoul
      max-attempts: 3
      base-delay-seconds: 60
      max-delay-seconds: 3600

management:
  endpoints:
    web:
      exposure:
        include: health, info, modulith   # prometheus는 micrometer 레지스트리 추가 시 노출

logging:
  level:
    org.springframework.modulith: INFO
