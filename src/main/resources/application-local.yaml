spring:
  # 로컬은 compose.yaml(postgres/mailpit)을 자동 기동/종료
  docker:
    compose:
      enabled: true
      lifecycle-management: start_and_stop

  datasource:
    url: jdbc:postgresql://localhost:5432/sift
    username: sift
    password: sift
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # 스키마 변경은 Liquibase changelog만 수행하고, Hibernate는 엔티티와의 정합성만 검증한다.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  batch:
    jdbc:
      # Batch 메타테이블도 db/changelog의 버전드 changeset으로 관리한다.
      initialize-schema: never

  mail:
    host: localhost
    port: 1025                  # mailpit SMTP (인증 없음)
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
