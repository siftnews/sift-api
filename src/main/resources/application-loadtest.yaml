sift:
  load-test:
    news:
      source-count: 10
      source-url-prefix: https://loadtest.sift.local/news/
      collection:
        entries-per-source: 1000
        article-url-prefix: https://loadtest.sift.local/collection/articles/
      selection:
        candidate-count: 10000
        window-hours: 24
        save-chunk-size: 500
        article-url-prefix: https://loadtest.sift.local/selection/articles/
    subscribers:
      count: 100000
      email-domain: loadtest.sift.local
    workload:
      topic-slug: dev
      # realistic은 D-019 선호 시각 패턴, overload는 한 시각 집중 시나리오다.
      scenario: realistic
      overload-send-hour: 8
    mail:
      # 0이면 실패 주입 없음. SMTP 설정이 있어도 loadtest sink는 네트워크를 사용하지 않는다.
      failure-every: 0
      processing-delay-ms: 0
