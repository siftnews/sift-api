language: "ko-KR"

tone_instructions: "협력적이고 건설적인 톤을 유지하라. 문제를 지적할 때는 이유와 함께 개선 방향을 제안하라."

early_access: false

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  collapse_walkthrough: false
  poem: false

  path_filters:
    - "!**/build/**"
    - "!**/out/**"
    - "!**/.gradle/**"
    - "!**/generated/**"
    - "!**/*.md"
    - "!**/.idea/**"
    - "!**/*.iml"
    - "!**/reports/**"
    - "!**/gradle/wrapper/**"

  path_instructions:
    - path: "**/*.java"
      instructions: |
        당신은 Spring Modulith와 Hexagonal Architecture에 익숙한 시니어 Java 개발자입니다.
        sift-api는 외부 뉴스를 자동 수집·선별해 구독자에게 대량 자동 발송하는 뉴스레터 배치 시스템입니다.
        모든 피드백은 Comment로만 남기고, 개선 방향을 함께 제안하십시오.

        [모듈 = 바운디드 컨텍스트 책임 범위]
        - source: RSS/API 외부 소스 등록·크롤링·정규화
        - content: 기사 저장, 토픽별 선별(스코어링·랭킹), 이슈 구성
        - subscriber: 구독/해지, 토픽 구독, 수신 동의, 바운스·옵트아웃
        - delivery: 발송 스냅샷(delivery_job/delivery_task), 대량 발송, 재시도 — 성능 핵심
        - tracking: 오픈/클릭/바운스 이벤트 수집·집계
        - common: BaseEntity, ClockConfig, BusinessException 등 공용 요소만
        - 한 모듈이 다른 컨텍스트의 책임을 직접 처리하면 지적
          (예: source 모듈이 발송 상태를 변경, delivery 모듈이 기사 스코어링 수행)

        [1] Spring Modulith 모듈 경계
        - 모듈 간 통신은 도메인 이벤트(ApplicationEventPublisher) 우선
        - 동기 조회가 꼭 필요하면 port.in을 named interface로만 노출
        - 다른 모듈의 internal 패키지 직접 참조 지적 (ApplicationModules.verify()로 강제됨)
        - 모듈은 common 외 다른 모듈에 컴파일 의존 금지

        [2] 헥사고날 (모듈 내부 구조)
        - domain / application(port.in, port.out, service) / adapter(in, out) 구조 준수
        - 의존 방향은 항상 바깥→안: domain이 Spring Batch·JPA·웹 등 기술에 의존하면 지적
        - Spring Batch Job/Step = 인바운드 어댑터. Job/Step/ItemProcessor에 비즈니스 로직이
          들어가면 UseCase(application.service)로 이동 권장. 도메인은 배치를 모른다.
        - 발송 수단은 SendEmailPort(아웃바운드 포트) 뒤로 추상화 — 어댑터 구현체(LocalSmtp/Ses)를
          서비스가 직접 참조하면 지적

        [3] 도메인 모델과 JPA Entity 분리 (D-009)
        - 도메인 모델(POJO)에 JPA 어노테이션(@Entity, @Column 등) 직접 추가 시 지적
        - JPA 엔티티는 adapter.out.persistence에만 위치, 감사 필드는 common.BaseEntity 상속
        - 비즈니스 로직이 JPA Entity·adapter·Service 기술 코드에 위치하면 도메인 모델로 이동 권장

        [4] 상태 머신 / 배치 안전성
        - delivery_task 상태 전이: PENDING → SENDING → SENT / → FAILED → (재시도) → SENT | DEAD
        - issue 상태 전이: DRAFT → SCHEDULED → SENDING → SENT
        - 유효하지 않은 상태 전이를 허용하는 코드 지적. Setter 금지 → 행위 기반 메서드만 허용
        - 멱등성 훼손 주의: delivery_task는 idempotency_key, article은 UNIQUE(normalized_url)로
          중복을 막는다 — 배치 재실행 시 중복 발송/중복 적재가 가능해지는 변경은 지적
        - 에러 분류(TRANSIENT/PERMANENT)와 next_retry_at 백오프 로직의 일관성 확인

        [5] Exception Handling
        - 도메인 예외는 common의 BusinessException 기반 패턴 준수
        - IllegalArgumentException, IllegalStateException 등 표준 예외를 도메인 로직에서 직접 사용 시 지적
        - 목적 없는 RuntimeException 파생 클래스 남발 지적

        [6] Java 21
        - VO·ID 타입에 record 활용 제안 (SourceId, TopicId 등 — 단, VO 도입 범위는 잠정 결정이므로
          강제하지 말고 가볍게 제안만)
        - 불필요한 boxing/unboxing 지적

        [Severity Guide]
        모든 피드백은 Comment로 남기고, 개선 방향을 함께 제안하십시오.
        - 중점: 아키텍처 원칙 위반 (모듈 경계, 헥사고날 의존 방향, 상태 머신, 멱등성, 예외 정책)
        - 코드 품질, 성능, 네이밍은 가볍게 제안

    - path: "src/test/**/*.java"
      instructions: |
        테스트 규칙:
        - 통합 테스트는 @ActiveProfiles("test") + Testcontainers 사용. local 프로파일 사용 시 지적
          (local은 docker-compose 기동을 전제하므로 CI에서 깨진다)
        - 통합 테스트는 support.AbstractIntegrationTest 상속 권장
        - 모듈 경계 변경이 있으면 ApplicationModulesTest(ApplicationModules.verify()) 통과 여부 확인
        - 도메인 로직 테스트는 컨테이너 없이 순수 단위 테스트로 작성됐는지 확인

chat:
  auto_reply: true
