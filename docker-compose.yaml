services:
  postgres:
    # 테스트(Testcontainers)의 TestContainerImages.POSTGRES_IMAGE와 태그를 맞춘다 —
    # 어긋나면 이미지를 중복으로 받게 되고, 테스트와 로컬 실행의 DB가 달라진다.
    image: 'postgres:16-alpine'
    environment:
      POSTGRES_DB: sift
      POSTGRES_USER: sift
      POSTGRES_PASSWORD: sift
    ports:
      - '5432:5432'
    volumes:
      - 'sift-pgdata:/var/lib/postgresql/data'
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U sift -d sift' ]
      interval: 10s
      timeout: 5s
      retries: 5

  # 로컬 메일 캡처 (MailHog 후속. arm64/Apple Silicon 호환 양호)
  mailpit:
    image: 'axllent/mailpit:latest'
    ports:
      - '1025:1025'   # SMTP
      - '8025:8025'   # Web UI -> http://localhost:8025

volumes:
  sift-pgdata:
